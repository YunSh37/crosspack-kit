[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crosspack-kit"
version = "0.1.0"
description = "Zero-dependency CLI for GitHub Actions Windows packaging (Tauri MSI/NSIS, PyInstaller onedir+InnoSetup), AV trigger audits, and SHA256SUMS."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []
keywords = ["tauri", "pyinstaller", "windows", "github-actions", "innosetup", "packaging", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]

[project.scripts]
crosspack-kit = "crosspack_kit:main"

[tool.setuptools]
py-modules = ["crosspack_kit"]
